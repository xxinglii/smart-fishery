<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塘口仪表台 · ESP32 鱼塘智能监测与投喂决策系统（原型 Demo）</title>
<meta name="description" content="基于 ESP32 传感网络的鱼塘监测与投喂决策系统原型。每个数字都带证据等级，每个预测都是区间。">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23050D0C'/><path d='M6 20c3-5 6-5 9 0s6 5 9 0' stroke='%235BE9A6' stroke-width='2.4' fill='none' stroke-linecap='round'/><circle cx='16' cy='11' r='2.6' fill='%235BE9A6'/></svg>">
</head>
<body>

<div class="shell">

  <!-- ================= 左侧导航 ================= -->
  <aside class="rail">
    <div class="brand">
      <div class="mark">塘口<em>仪表台</em></div>
      <div class="sub">Pond Instrument Console</div>
      <div class="ver">PROTOTYPE · v0.9</div>
    </div>
    <nav class="nav"></nav>
    <div class="rail-foot">
      <div class="row"><span>节点在线</span><b>6 / 6</b></div>
      <div class="row"><span>上次采样</span><b id="clock">--:--:--</b></div>
      <div class="row"><span>链路</span><b>LoRa · 4G</b></div>
      <div class="row" style="margin-top:8px">
        <span><span class="pulse"></span> 数据流正常</span>
      </div>
      <div class="row" style="margin-top:14px;line-height:1.5;align-items:flex-start">
        <span style="color:var(--dim)">本页全部为<b style="color:var(--amber)">演示用模拟数据</b>，<br>不可用于生产决策。</span>
      </div>
    </div>
  </aside>

  <!-- ================= 主区 ================= -->
  <div class="main">
    <header class="topbar">
      <button class="btn ghost rail-toggle" id="rail-toggle" style="padding:7px 11px">☰</button>
      <h1>1 号塘 · 草鱼主养</h1>
      <span class="path" id="crumb">OVERVIEW / 总览</span>
      <span class="spacer"></span>
      <span class="status-pill"><span class="pulse"></span> ESP32 网络 · 6 节点</span>
      <span class="status-pill" style="color:var(--amber)">⚠ 待校准阈值 ×3</span>
    </header>

    <main id="view" class="view"></main>

    <footer class="foot" style="padding:0 30px 40px">
      <span>塘口仪表台 · ESP32 鱼塘智能监测与投喂决策系统 · 原型 Demo</span>
      <span>承接《鱼塘自动投喂系统实施方案 v2》+ 三路调研 + 五轮对抗 + 红队评审</span>
      <span>⛔ 演示数据 · 不可用于生产决策</span>
    </footer>
  </div>
</div>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
